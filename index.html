<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HellThorn SMP</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }
        a {
            color: #eee;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            margin: 0 10px;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
        }
        nav a:hover {
            color: #fff;
        }
        .btn-vote {
            background-color: #1e90ff;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-vote:hover {
            background-color: #3aa0ff;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p.desc {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #ccc;
        }
        .btn-join {
            background-color: #2962ff;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 40px;
        }
        .btn-join:hover {
            background-color: #558bff;
        }
        .notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            z-index: 1000;
        }
        section.features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .feature-box {
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 10px;
            width: 250px;
            text-align: left;
            box-shadow: 0 0 5px #000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-box h3 {
            margin: 0;
            font-weight: 700;
            flex-grow: 1;
        }
        .small-tag {
            font-size: 0.8rem;
            background-color: #2962ff;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: 600;
        }
        .image-container {
            max-width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 60px;
            box-shadow: 0 0 10px #000;
        }
        .image-container img {
            width: 100%;
            display: block;
        }
        footer {
            background-color: #1e1e1e;
            padding: 20px;
            text-align: center;
            color: #eee;
            margin-top: 40px;
        }
        footer h3 {
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        footer .social-icons a img {
            width: 40px;
            height: 40px;
            transition: transform 0.3s ease;
        }
        footer .social-icons a img:hover {
            transform: scale(1.1);
        }
        /* Responsive */
        @media (max-width: 700px) {
            h1 {
                font-size: 2.2rem;
            }
            .feature-box {
                width: 100%;
            }
            footer .social-icons {
                gap: 15px;
            }
            footer .social-icons a img {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
